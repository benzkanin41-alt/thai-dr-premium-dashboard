name: Update DR Dashboard

on:
  schedule:
    # Keep the five-minute cadence away from the top-of-hour congestion window.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright and select browser
        run: |
          python -m pip install playwright
          browser="$(command -v google-chrome || true)"
          if [ -n "$browser" ]; then
            echo "DR_DASHBOARD_BROWSER_EXECUTABLE=$browser" >> "$GITHUB_ENV"
          else
            python -m playwright install --with-deps chromium
          fi

      - name: Build dashboard data
        run: python scripts/build_static_data.py

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
